name: Organize Red Team References

on:
  push:
    paths:
      - ".github/workflows/organize_references.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out existing CBBH notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Integrate public note collections and referenced images
        run: python3 .github/scripts/organize_references.py

      - name: Commit notes to primary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Expand red team notes and repair image references"
          git push origin HEAD:master
